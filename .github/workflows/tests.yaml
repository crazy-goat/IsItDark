name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The required status check is `ci-ok`. Fork pull requests need a maintainer's approval to run
# workflows (repository/organisation setting), so no actor check is needed here.
jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main
    with:
      # Everything else (src/, tests/, examples/, bin/, composer.json, phpunit.xml, workflows ...) is code.
      # No test reads Markdown files, so README.md and docs/ are documentation only.
      docs-regex: '^(.*\.md|LICENSE.*|\.gitignore|\.gitattributes|docs/.*|\.github/ISSUE_TEMPLATE/.*|\.github/pull_request_template\.md)$'

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install shellcheck
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-v0.11.0/shellcheck
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version

      - name: Run lint
        run: bin/lint.sh

  tests:
    name: tests (PHP ${{ matrix.php-version }})
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
